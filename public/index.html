<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Barcode Reader</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        header {
            padding: 12px 16px;
            background: #1b1b1b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background: #ef4444;
        }

        .dot.on {
            background: #22c55e;
        }

        video {
            width: 100%;
            flex: 1;
            object-fit: cover;
            background: #000;
        }

        footer {
            padding: 14px 16px;
            background: #1b1b1b;
        }

        #last {
            font-size: 18px;
            font-weight: 600;
            word-break: break-all;
        }

        #meta {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <div><span id="dot" class="dot"></span><span id="status">Connecting...</span></div>
        <span id="count">0 scans</span>
    </header>
    <video id="video" playsinline muted autoplay></video>
    <footer>
        <div id="last">Point camera at a barcode</div>
        <div id="meta">Waiting for scan...</div>
        <button id="startBtn" type="button">Start Camera</button>
    </footer>

    <script type="module">
        const video = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const dotEl = document.getElementById("dot");
        const lastEl = document.getElementById("last");
        const metaEl = document.getElementById("meta");
        const countEl = document.getElementById("count");
        const startBtn = document.getElementById("startBtn");

        let scans = 0;
        let scanning = false;
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}`);

        ws.onopen = () => {
            statusEl.textContent = "Connected to PC";
            dotEl.classList.add("on");
        };
        ws.onclose = () => {
            statusEl.textContent = "Disconnected";
            dotEl.classList.remove("on");
        };
        ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.ok) {
                scans += 1;
                countEl.textContent = `${scans} scan${scans === 1 ? "" : "s"}`;
                lastEl.textContent = msg.code;
                metaEl.textContent = `Sent (${msg.format}) + Enter`;
                if (navigator.vibrate) navigator.vibrate(80);
            }
        };

        function sendScan(code, format) {
            if (!code || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ code, format }));
        }

        async function startZxingFallback() {
            metaEl.textContent = "Using @zxing/browser fallback...";
            const { BrowserMultiFormatReader } = await import("https://esm.sh/@zxing/browser@0.2.1");
            const reader = new BrowserMultiFormatReader();

            scanning = true;
            startBtn.style.display = "none";

            // Continuously decodes from the rear camera onto the <video> element
            await reader.decodeFromConstraints(
                { video: { facingMode: { ideal: "environment" } }, audio: false },
                video,
                (result, err) => {
                    if (!scanning) return;
                    if (result) {
                        const code = result.getText();
                        const format = result.getBarcodeFormat ? String(result.getBarcodeFormat()) : "ZXING";
                        sendScan(code, format);
                    }
                }
            );
        }

        async function startCamera() {
            if (!("BarcodeDetector" in window)) {
                await startZxingFallback();
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false,
            });
            video.srcObject = stream;
            await video.play();

            const detector = new BarcodeDetector({
                formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code", "itf"],
            });

            scanning = true;
            startBtn.style.display = "none";

            async function loop() {
                if (!scanning) return;
                if (video.readyState >= 2 && ws.readyState === WebSocket.OPEN) {
                    try {
                        const codes = await detector.detect(video);
                        if (codes.length > 0) {
                            const first = codes[0];
                            sendScan(first.rawValue, first.format);
                        }
                    } catch (_) { }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener("click", () => {
            startCamera().catch((err) => {
                metaEl.textContent = `Camera error: ${err.message}`;
            });
        });
    </script>
</body>

</html>
